# =============================================================================
# Sunbird RC Credentialling - environment inputs (equivalent of docker .env)
#
# Deploy (from deploy-as-code/helm/v2/credentialling):
#   export DB_PASSWORD='<strong-password>'
#   ./install.sh install
#
# images.yaml           -> image versions
# global-resources.yaml -> cpu / memory / volume sizes
# global-values.yaml    -> this file: environment settings
#
# Do NOT commit real passwords. Keep a filled copy outside git.
# =============================================================================

global:
  host: "dev.sunbirded.org"

  sunbird:
    enable_auth: false               # ENABLE_AUTH
    jwks_uri: ""                     # JWKS_URI (required if enable_auth: true)
    signing_algo: Ed25519            # SIGNING_ALGORITHM
    qr_type: W3C_VC                  # QR_TYPE
    web_did_base_url: "https://example.com/identifier"   # WEB_DID_BASE_URL

  # Vault runs in-cluster (vault chart), service name "vault".
  # No token here - the vault-setup Job creates it and stores it in
  # Secret "vault-token", which identity-service reads as VAULT_TOKEN.
  vault:
    address: "http://vault:8200"           # VAULT_ADDR
    base_url: "http://vault:8200/v1"       # VAULT_BASE_URL
    root_path: "http://vault:8200/v1/kv"   # VAULT_ROOT_PATH
    vault_timeout: 5000                    # VAULT_TIMEOUT
    vault_proxy: false                     # VAULT_PROXY

  # Postgres credentials - used by the db chart (POSTGRES_USER/PASSWORD)
  # and by identity/schema/credentials to build their DATABASE_URL:
  #   postgres://<username>:<password>@db:5432/<database>
  # Prefer: export DB_PASSWORD=... before ./install.sh (keeps it out of git)
  db:
    username: postgres
    password: "<DB_PASSWORD>"         # only required input
    database: postgres

# -----------------------------------------------------------------------------
# Ingress: none. Services are cluster-internal
# (http://rc-identity-service:3332 etc.). The public IP / domain belongs to
# Spark's nginx-public-ingress; add routes there for public access.
# -----------------------------------------------------------------------------
identity-service:
  ingress:
    enabled: false

credential-schema-service:
  ingress:
    enabled: false

credentials-service:
  ingress:
    enabled: false

# -----------------------------------------------------------------------------
# vault - setup Job replaces setup_vault.sh (init, unseal, kv, token)
# -----------------------------------------------------------------------------
vault:
  setup:
    enabled: true
    keyShares: 5
    keyThreshold: 3
    kvPath: kv
    keysSecretName: vault-keys        # unseal keys + root token (= keys.txt)
    restartDeployments: []            # empty = <release>-identity-service
  autoUnseal:
    enabled: true                     # unseal automatically after vault pod restart

# -----------------------------------------------------------------------------
# oid4vc-service - compose "oid4vc-service" (profile oid4vc)
# -----------------------------------------------------------------------------
oid4vc-service:
  enabled: true
  ingress:
    enabled: false
  env:
    PUBLIC_URL: ""                    # empty = http://<global.host>/oid4vc-service
    INTERNAL_URL: ""                  # empty = http://<release>-oid4vc-service:3400
    SESSION_STORE: "memory"           # memory | redis
    REDIS_URL: ""                     # needed only if SESSION_STORE=redis
    ISSUER_DID: ""
    VERIFIER_DID: ""
    OID4VP_ENABLED: "true"
    DRAFT13_COMPAT_MODE: "false"
    OID4VP_SIGN_REQUEST: "false"
    OID4VP_LEGACY_CLIENT_ID_SCHEME: "false"
    AUTH_ISSUER: ""
