# Public entry point (same idea as Spark's nginx-public-ingress / docker sunbird-rc-nginx).
# A LoadBalancer Service gets a public IP; point the domain (global.host) to it.
enabled: true

replicaCount: 1

image:
  # official nginx image variant that runs as non-root (uid 101) on port 8080
  repository: nginxinc/nginx-unprivileged
  # empty = Chart appVersion. Set versions in images.yaml.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  # Optional: use an existing Azure static public IP instead of a new one.
  #   service.beta.kubernetes.io/azure-load-balancer-ipv4: "<ip>"
  #   service.beta.kubernetes.io/azure-load-balancer-resource-group: "<rg of the ip>"
  annotations: {}
  # Limit who can reach the LoadBalancer (empty = everyone), e.g. ["106.51.119.79/32"]
  loadBalancerSourceRanges: []

# Path -> service. Service names are <release>-<name>.
routes:
  - path: /identity-service/
    service: identity-service
    port: 3332
  - path: /credential-schema-service/
    service: credential-schema-service
    port: 3333
  - path: /credentials-service/
    service: credentials-service
    port: 3000
  - path: /oid4vc-service/
    service: oid4vc-service
    port: 3400

clientMaxBodySize: 10m
proxyTimeoutSeconds: 120

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
