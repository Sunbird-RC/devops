{{- $db := .Values.global.db }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "credential-schema-service.fullname" . }}
  labels:
    {{- include "credential-schema-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # built from global.db (same values the db chart uses)
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:%v/%s" $db.username ((required "global.db.password is required" $db.password) | urlquery) ($db.host | default "db") ($db.port | default 5432) $db.database | quote }}
