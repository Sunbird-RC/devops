{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oid4vc-service.fullname" . }}
  labels:
    {{- include "oid4vc-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "oid4vc-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "oid4vc-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: PUBLIC_URL
              value: {{ .Values.env.PUBLIC_URL | default (printf "http://%s/oid4vc-service" (.Values.global.host | default "localhost")) | quote }}
            - name: INTERNAL_URL
              value: {{ .Values.env.INTERNAL_URL | default (printf "http://%s:%v" (include "oid4vc-service.fullname" .) .Values.service.port) | quote }}
            # URLs of the other services (same as docker-compose oid4vc-service)
            - name: IDENTITY_BASE_URL
              value: {{ printf "http://%s-identity-service:3332" .Release.Name | quote }}
            - name: SCHEMA_BASE_URL
              value: {{ printf "http://%s-credential-schema-service:3333" .Release.Name | quote }}
            - name: CREDENTIAL_SERVICE_BASE_URL
              value: {{ printf "http://%s-credentials-service:3000" .Release.Name | quote }}
            - name: ENABLE_AUTH
              value: {{ .Values.global.sunbird.enable_auth | quote }}
            - name: JWKS_URI
              value: {{ .Values.global.sunbird.jwks_uri | quote }}
            {{- range $key, $val := .Values.env }}
            {{- if and (ne $key "PUBLIC_URL") (ne $key "INTERNAL_URL") }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
