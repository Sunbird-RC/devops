{{- if not .Values.auth.existingSecret }}
{{- $g := (.Values.global).db | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  # global.db.* is shared with the secrets chart (builds DATABASE_URL from the same values)
  POSTGRES_USER: {{ $g.username | default .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ required "global.db.password is required" ($g.password | default .Values.auth.password) | quote }}
{{- end }}
