apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  # Same content as docker/v2/credentialling/vault.json
  vault.json: |
    {
      "listener": {
        "tcp": {
          "address": "0.0.0.0:8200",
          "tls_disable": 1
        }
      },
      "backend": {
        "file": {
          "path": "/vault/file"
        }
      },
      "default_lease_ttl": "168h",
      "max_lease_ttl": "0h",
      "api_addr": "http://0.0.0.0:8200",
      "ui": true,
      "disable_mlock": true
    }
