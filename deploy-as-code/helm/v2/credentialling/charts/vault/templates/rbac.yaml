{{- if .Values.setup.enabled }}
{{- $restart := .Values.setup.restartDeployments }}
{{- if not $restart }}{{- $restart = list (printf "%s-identity-service" .Release.Name) }}{{- end }}
# Least privilege for the setup Job: only its own two Secrets and the
# deployments it restarts. ("create" cannot be limited by name in Kubernetes.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-setup
  labels:
    app.kubernetes.io/name: vault-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-setup
  labels:
    app.kubernetes.io/name: vault-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.setup.keysSecretName }}
      - {{ .Values.setup.tokenSecretName }}
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      {{- range $restart }}
      - {{ . }}
      {{- end }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-setup
  labels:
    app.kubernetes.io/name: vault-setup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vault-setup
subjects:
  - kind: ServiceAccount
    name: vault-setup
    namespace: {{ .Release.Namespace }}
{{- end }}
